plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('src/generated/**/.cache')
}

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            ideName = 'ChocobosReborn Client'
        }
        visual {
            // Headless visual harness: straight into the 'harness' save (run/saves/harness).
            client()
            programArguments.addAll '--quickPlaySingleplayer', 'harness', '--width', '1024', '--height', '600'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            ideName = 'ChocobosReborn Visual'
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            ideName = 'ChocobosReborn Server'
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
            ideName = 'ChocobosReborn Data'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
            gameDirectory = project.file('run')
        }
        verification {
            type = 'gameTestServer'
            gameDirectory = project.file('build/verification')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        latencyServer {
            server()
            programArgument '--nogui'
            systemProperty 'chocobosreborn.harness', 'server'
        }
        latencyClient {
            client()
            programArguments.addAll '--quickPlayMultiplayer', '127.0.0.1:25579', '--username', 'LatencyRider', '--width', '1024', '--height', '600'
            systemProperty 'chocobosreborn.harness', 'client'
        }
    }
    runs.latencyServer.gameDirectory = project.file('build/latency/server')
    runs.latencyClient.gameDirectory = project.file('build/latency/client')
    [runs.latencyServer, runs.latencyClient].each {
        it.systemProperty 'chocobosreborn.harness.output', project.file('build/latency/results').absolutePath
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    // every course's plan is cached while the course tests run; 48 islands outgrow the 512 MB default
    maxHeapSize = '2g'
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jar', Jar).configure {
    exclude 'tk/darrow/chocobosreborn/gametest/**'
    exclude 'tk/darrow/chocobosreborn/harness/**'
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// The gametest world persists between runs and would keep old course blocks; start clean.
tasks.named('runVerification') {
    doFirst { delete(file('build/verification/world')) }
}

// Let the Python harness own the game processes directly (and shut them down reliably).
tasks.register('prepareLatencyHarness') {
    dependsOn 'classes', 'prepareLatencyServerRun', 'prepareLatencyClientRun'
    doLast {
        ['Server', 'Client'].each { side ->
            def run = tasks.named("runLatency${side}").get()
            def destination = file("build/latency/${side.toLowerCase()}/launch.json")
            destination.parentFile.mkdirs()
            def command = [run.javaLauncher.get().executablePath.asFile.absolutePath]
            command.addAll(run.allJvmArgs)
            command.addAll(['-cp', run.classpathProvider.asPath, run.mainClass.get()])
            command.addAll(run.args)
            run.argumentProviders.each { command.addAll(it.asArguments()) }
            destination.text = groovy.json.JsonOutput.toJson(command)
        }
    }
}
